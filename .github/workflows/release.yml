# release.yml
# -----------
# Fires when a version tag (v*.*.*) is pushed to main.
# Packages only the /init starter files and publishes a GitHub release.
#
# After this release is published, sync-example.yml fires automatically
# to copy the new init files into /example and redeploy the live site.
#
# To release:
#   git tag v0.2.3
#   git push origin v0.2.3

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Write version into init/VERSION
        run: echo "${{ env.VERSION }}" > init/VERSION

      - name: Write version into init/package.json
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('init/package.json','utf8'));p.version='${{ env.VERSION }}'.replace(/^v/,'');fs.writeFileSync('init/package.json',JSON.stringify(p,null,2)+'\\n')"

      - name: Sync tests to init template
        run: cp -R tests/. init/tests/

      # Test battery fix: repo tests import engine files via ../engine/, which
      # does not exist inside the init/ template (engine lives only in the npm
      # package). Tests running from the template must import the template's
      # own copies in scripts/ and src/. The mapping is proven on the actual
      # zip contents (all three import styles covered: `from '../engine/...`),
      # `await import('../engine/...')`, and proxy tests' `from '../init/...`).
      # Plain string remap, not perl with layered YAML/perl escaping: the
      # v1.0.0-era perl line regex was correct as authored but its second
      # rule ('from ../engine/' form) reached CI as an Unmatched-( regex and
      # exited 255, killing the release one step before the archive. String
      # joins do the same job with zero escape layers.
      - name: Fix test imports for template context
        run: |
          node -e "
          const fs = require('fs');
          const dir = 'init/tests';
          if (!fs.existsSync(dir)) { console.log('no init/tests -- nothing to remap'); process.exit(0); }
          for (const f of fs.readdirSync(dir)) {
            if (!f.endsWith('.js') && !f.endsWith('.mjs')) continue;
            const p = dir + '/' + f;
            let s = fs.readFileSync(p, 'utf8');
            const before = s;
            // Longest prefix first. Tests live in init/tests/ and must reach
            // init/scripts/ + init/src/-- one '../' from the test file, NOT
            // './' (file-relative resolution goes through the tests dir).
            s = s.split('../engine/scripts/').join('../scripts/');
            s = s.split('../engine/src/').join('../src/');
            s = s.split('../engine/').join('../');
            s = s.split('../init/scripts/').join('../scripts/');
            s = s.split('../init/').join('../');
            if (s !== before) { fs.writeFileSync(p, s); console.log('remapped', p); }
          }
          "

      # One devDeps write: everything the template test battery needs that
      # the template package.json does not declare -- react/rrd/vite/vitest
      # (peers must be concrete for a standalone npm test) and happy-dom
      # (islands/use-page-meta DOM). Puppeteer is deliberately NOT here:
      # no test imports it for real (the render path is asserted to fail
      # closed), and carrying it would drag the basic-ftp/extract-zip chain
      # into every consumer checkout that runs the battery.
      - name: Make the template test battery self-sufficient
        run: |
          node -e "
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('init/package.json','utf8'));
          p.devDependencies=Object.assign({},p.devDependencies,{
            react:'^18.3.1',
            'react-dom':'^18.3.1',
            'react-router-dom':'^6.30.1',
            vite:'^6.4.5',
            vitest:'^5.0.5',
            'happy-dom':'^21.0.4',
            express:'^5.3.0'
          });
          // Supply-chain pin: vitest 2.x resolves tinypool 1.x, which carries
          // the twin prototype-pollution RCEs (GHSA-5gmw-xhrv-c9v3 /
          // GHSA-85c8-ppgw-ccpr, patched in tinypool 2.1.2). The battery runs
          // on the patched line -- see the overrides doc in CHANGELOG.
          p.overrides=Object.assign({},p.overrides,{tinypool:'^2.2.0'});
          fs.writeFileSync('init/package.json',JSON.stringify(p,null,2)+'\\n');
          "

      - name: Verify the template test battery passes before release
        working-directory: init
        run: |
          npm install --no-audit --no-fund
          npx vitest run

      - name: Build release archive
        run: |
          PACKAGE_DIR="prestruct-${{ env.VERSION }}"
          ARCHIVE="${PACKAGE_DIR}.zip"

          mkdir -p "${PACKAGE_DIR}"
          cp -R init/. "${PACKAGE_DIR}/"

          # The zip must be self-sufficient: tests in, but build/test junk
          # never (npm pack uses DISK state -- pass-4/7 lesson, same here).
          rm -rf "${PACKAGE_DIR}/node_modules" "${PACKAGE_DIR}/dist" \
                 "${PACKAGE_DIR}/.prestruct" "${PACKAGE_DIR}/package-lock.json"
          # PACKAGE_DIR/tests already came in via `cp -R init/.` above: the
          # remapped init/tests copies. Do NOT re-copy raw repo tests over
          # them -- that shipped v1.1.0's first zip with ../engine/ imports
          # that only resolve in the repo, not in the artifact.

          zip -r "${ARCHIVE}" "${PACKAGE_DIR}"

          # Guardrail: release artifacts should only contain starter files from init/
          unzip -l "${ARCHIVE}" | grep -q "${PACKAGE_DIR}/scripts/prerender.js"
          unzip -l "${ARCHIVE}" | grep -q "${PACKAGE_DIR}/src/main.jsx"
          unzip -l "${ARCHIVE}" | grep -q "${PACKAGE_DIR}/tests/engine.test.js"
          unzip -l "${ARCHIVE}" | grep -q "${PACKAGE_DIR}/ssr.config.example.js"
          if unzip -l "${ARCHIVE}" | grep -q "node_modules"; then
            echo "node_modules leaked into the archive."
            exit 1
          fi
          if unzip -l "${ARCHIVE}" | grep -q "example/"; then
            echo "Unexpected example/ path found in archive."
            exit 1
          fi

          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      # The in-init battery above can pass while the shipped zip fails:
      # ../engine/ imports resolve inside init/ but not in the artifact
      # (v1.0.0 AND v1.1.0's first zip shipped exactly that). So gate the
      # release on THE ARTIFACT'S OWN battery: unzip it, install it, run it.
      - name: Run the artifact's own battery before release
        run: |
          rm -rf /tmp/zip-verify && mkdir -p /tmp/zip-verify
          unzip -q "${{ env.ARCHIVE }}" -d /tmp/zip-verify
          cd /tmp/zip-verify/prestruct-${{ env.VERSION }}
          npm install --no-audit --no-fund
          npx vitest run

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Prestruct ${{ env.VERSION }}"
          body: |
            ## Prestruct ${{ env.VERSION }}

            ### What's in this release

            | File | Purpose |
            |------|---------|
            | `scripts/inject-brand.js` | Engine: injects global SEO meta into `dist/index.html` |
            | `scripts/prerender.js` | Engine: renders each route to static HTML, generates sitemap + 404 |
            | `scripts/validate-config.js` | Engine: shape-checks ssr.config.js, structured diagnostics |
            | `scripts/proxy.js` | Bot proxy, VPS variant: Express + Puppeteer, disk cache |
            | `scripts/proxy.worker.js` | Bot proxy, Cloudflare Worker variant: Browser Rendering + KV cache |
            | `src/islands.js` | Engine: mounts island components into `<pre-island>` elements |
            | `src/hooks/usePageMeta.js` | Hook: keeps head tags in sync on client-side navigation |
            | `src/App.jsx` | Template: BrowserRouter wrapper, client entry point |
            | `src/AppIslands.jsx` | Template: island registry, map names to components |
            | `src/AppLayout.jsx` | Template: routes + layout, no BrowserRouter, islands wired |
            | `src/main.jsx` | Template: client entry, hydrateRoot or createRoot |
            | `ssr.config.example.js` | Starter config: copy to ssr.config.js, every config key commented |
            | `index.html` | Shell template: meta injected at build time, not hardcoded |
            | `public/_redirects` | CF Pages redirect rules, SPA fallback intentionally omitted |
            | `public/_headers` | Security headers and CDN cache rules |
            | `wrangler.toml` | Worker proxy binding scaffold (BROWSER, CACHE, vars) |
            | `vite.config.js` / `vitest.config.js` | Build and test configuration |
            | `tests/` | Test battery: engine, islands, proxy, inject-brand, cache -- self-sufficient, run `npm test` |

            The engine source of truth lives in the npm package (`npm i -D prestruct`). This
            template is the copy-shipped form of the same files for projects that prefer
            owning the scripts; the CLI copies the identical content via `npx prestruct init`.

            ### Quick start

            Download and unzip the archive, then copy the files from `prestruct-${{ env.VERSION }}/` into your project root.
            Copy `ssr.config.example.js` to `ssr.config.js`, fill in your site details and wire your routes into `AppLayout.jsx`.
            Run `npm install` then `npm run build` (validate -> vite build -> inject-brand -> prerender).

            See [README.md](README.md) and the [live example](https://prestruct.creadev.org) for full integration docs.
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
