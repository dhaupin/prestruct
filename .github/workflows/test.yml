# test.yml
# ========
# Runs tests on every PR and push to main.
# CI for: tests, build, and prerender.

name: Test

on:
  pull_request:
  push:
    branches:
      - main

# No test in this suite drives a real browser (the render path is asserted
# to fail closed), so Chromium (~170MB via puppeteer's install-time fetch,
# which is also the vulnerable extract-zip/basic-ftp chain) is pure CI cost.
env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install init dependencies
        run: cd init && npm install

      - name: Run unit tests
        run: npm run test:run

      # Docs audit suite (ported from dhaupin/vant): frontmatter, links,
      # style, language, truthfulness, fiction signatures.
      - name: Docs audit
        run: npm run lint:docs && npm run lint:claims

      - name: Lint
        run: cd init && npm run lint

      # The tracked template tree: builds green without a config (the audit
      # step is config-aware: init/scripts/audit-if-configured.cjs refuses
      # with a named skip when ssr.config.js is absent, per the unconfigured
      # scaffold contract).
      - name: Build the template shell
        run: cd init && npm run build

      # The audited gate: the example is the tracked CONFIGURED project --
      # its build ends in the real prestruct audit (verified locally:
      # 0 failures / 0 warnings / exit 0). A head regression now fails CI,
      # not only a local build.
      - name: Build + audit the example
        run: cd example && npm install --no-audit --no-fund && npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: init-dist
          path: init/dist/
          retention-days: 7

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7