# docs.yml - builds docs/ with Jekyll + freestruct + pagefind, then deploys
# to GitHub Pages. Frame ported from eyestruct's docs.yml (itself ported
# Gistory's / freestruct's dogfood runbook).
#
# The site lands at docs.creadev.org/prestruct - the docs/_config.yml pins
# baseurl: "/prestruct", so the Pages custom domain docs.creadev.org must be
# set in the repo's Pages settings once (one-time dashboard step; the
# workflow deploys the artifact regardless).
#
# Local: the docs build needs Ruby; `npm run lint:docs` is the node-only
# slice and runs everywhere. The Jekyll stack itself is runnable locally with
# no root (see labs/TASKS.md pass 61 for the recipe).

name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package-lock.json'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: docs
        run: bundle install

      # The freestruct SEO layer needs its devDep; the root lockfile is law.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps (freestruct devDep for the SEO layer)
        run: npm ci --no-audit --no-fund

      - name: Jekyll build
        working-directory: docs
        run: bundle exec jekyll build

      # --strict: broken links and dangerous tags fail the build. Discovery
      # walks up from cwd (repo root) to docs/freestruct.config.yml; the
      # output tree defaults to docs/_site.
      - name: Run freestruct strict (SEO layer: canonical, OG, JSON-LD identity)
        run: node node_modules/freestruct/bin/freestruct.mjs --strict

      - name: Download Pagefind
        working-directory: docs
        run: |
          VERSION=$(curl -sL "https://api.github.com/repos/Pagefind/pagefind/releases/latest" | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sL "https://github.com/Pagefind/pagefind/releases/download/v${VERSION}/pagefind-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" -o pagefind.tar.gz
          tar -xzf pagefind.tar.gz
          rm pagefind.tar.gz

      - name: Index search with Pagefind
        working-directory: docs
        run: ./pagefind --site _site

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_site'

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5