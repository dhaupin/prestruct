# docs.yml - a THIN caller of freestruct's canonical reusable docs lane
# (dhaupin/freestruct#31, promoted in .github/workflows/docs-lane.yml).
#
# The Jekyll -> freestruct -> pagefind -> Pages runbook that used to live here
# inline (118 lines, hand-ported from eyestruct/gistory) now lives in the lane
# as `on: workflow_call`, so prestruct no longer hand-maintains a copy that
# drifts from the rig (the drift table in dhaupin/flowforge#9 is the receipt).
#
# The site lands at docs.creadev.org/prestruct - docs/_config.yml pins
# baseurl: "/prestruct" and docs/freestruct.config.yml sets basePath: /prestruct
# (site.url stays the origin; both carrying the prefix would double it).
#
# The lane's deploy job is gated to main INSIDE the reusable workflow, so a
# staging push (in the trigger below) BUILDS the docs - the freestruct strict
# and pagefind legs are worth running - but cannot publish them.
#
# Local: the docs build needs Ruby; `npm run lint:docs` is the node-only slice
# and runs everywhere. The rootless Jekyll recipe is in labs/TASKS.md (pass 61).

name: Deploy docs

on:
  push:
    branches: [main, staging]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package-lock.json'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    # Pinned to a freestruct SHA (the lane's own "every install is pinned"
    # doctrine; main is the only ref that carries the lane today).
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@124f367d26d99caa249af7a8503db7869ee32004
    with:
      # The lane defaults to freestruct's in-repo layout (`node bin/freestruct.mjs`).
      # prestruct consumes freestruct as an npm devDep, so point at the install.
      freestruct-cmd: node node_modules/freestruct/bin/freestruct.mjs
      # Pin the crashtest dogfood leg to the version prestruct's committed
      # ledger was cut with (v1.1.0), not the lane's default moving ref.
      crashtest-ref: 2d1fe793e2d4732b9eea52cc4199d54c6e3b0091
