name: Verify init/example engine sync

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  verify-engine-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The file list lives in ONE place: the generator's CONTRACT array.
      # scripts/sync-engine.mjs uses only node builtins, so no install is
      # needed. (An earlier hand-copied list here held 6 of the 10 contract
      # files -- a subset that silently drifted from the generator.)
      - name: Verify engine == init == example (node scripts/sync-engine.mjs check)
        run: node scripts/sync-engine.mjs check
