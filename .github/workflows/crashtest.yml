# crashtest.yml
# --------------
# Runs the packs/public/prestruct-proxy crash-test pack against BOTH shipped
# proxy runtimes, driven by the committed crashtest.config.js:
#
#   adapters.express -> init/scripts/proxy.js    createProxyApp(config)
#   routes.worker    -> init/scripts/proxy.worker.js  fetch(request, env)
#
# The run is in-process and never opens a socket. No browser is installed on
# purpose: puppeteer imports fail closed, which is exactly the contract the
# pack's bot-render-fallback row pins (render failure must fall through to
# the live-site 302, not crash).
#
# Gate rule (encoded by crashtest itself, same rule labs/hardening.md
# documents): exit 0 unless a NEW EXPLOITED finding appears or something
# previously REFUSED regresses. The regenerated labs/*. artifacts are run
# stamps, not required to match HEAD byte-for-byte (timestamps move); they
# upload as an artifact on failure for triage.
#
# The harness version is pinned via the EXACT devDependency -- the pin tracks
# the version the committed labs/ ledger was produced with (a floating `@1`
# re-scoped the gate on 1.1.0: 19 new rows, zero new verdicts on this target).
# Upgrading the harness is deliberately ONE command and one commit:
#
#     npm run crashtest:bump 1.2.0
#
# which installs the new exact pin, runs the harness (regenerating labs/),
# verifies the devDep pin == ledger stamp invariant, and prints the tally +
# baseline diff. Commit package.json + package-lock.json + labs/ together.
# tests/qc.test.mjs fails any tree where the pin and the stamp drift apart.

name: crashtest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  proxy-pair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      # packstruct is the shared /packs spec linter (crashtest#16 class): a
      # manifest declaring an entry that does not ship dies HERE, at lint
      # time, before the harness ever loads the pack.
      - name: Lint the pack manifests (packstruct)
        run: npm run lint:packs

      # crashtest is an exact devDependency, so the gate runs against the tree
      # the ledger was cut with -- no npx fetch, no float. Bump it with
      # `npm run crashtest:bump <version>` (header comment above).
      # CI runs the READ-ONLY lane (--expect-baseline): full campaign, exit
      # rules unchanged (0 held / 1 new-EXPLOITED-or-regression / 2 config),
      # but labs/ is diffed, never rewritten -- the committed ledger is cut by
      # bump/canonical runs, and a CI execution writing it would make every
      # PR/fork run leak drive-by ledger churn into the checkout. Verified
      # locally: same 54/54 tally, byte-identical labs/ artifacts.
      - name: Run the proxy pack
        run: npx crashtest run --expect-baseline labs/crashledger.json

      - name: Upload the hardening artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hardening
          path: |
            labs/hardening.md
            labs/crashledger.json
            labs/run-meta.json
