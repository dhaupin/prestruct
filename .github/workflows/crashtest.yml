# crashtest.yml
# --------------
# Runs the packs/public/prestruct-proxy crash-test pack against BOTH shipped
# proxy runtimes, driven by the committed crashtest.config.js:
#
#   adapters.express -> init/scripts/proxy.js    createProxyApp(config)
#   routes.worker    -> init/scripts/proxy.worker.js  fetch(request, env)
#
# The run is in-process and never opens a socket. No browser is installed on
# purpose: puppeteer imports fail closed, which is exactly the contract the
# pack's bot-render-fallback row pins (render failure must fall through to
# the live-site 302, not crash).
#
# Gate rule (encoded by crashtest itself, same rule labs/hardening.md
# documents): exit 0 unless a NEW EXPLOITED finding appears or something
# previously REFUSED regresses. The regenerated labs/*. artifacts are run
# stamps, not required to match HEAD byte-for-byte (timestamps move); they
# upload as an artifact on failure for triage.
#
# The harness version is PINNED, deliberately, and the pin tracks the version
# the committed labs/ ledger was produced with. `crashtest@1` floats to the
# newest 1.x: 1.1.0 exists and adds 19 rows (35 -> 54) without changing a single
# existing verdict -- and all 19 are permanent skip rows for governance/memory
# vocabulary this target never declares, so they buy prestruct zero applicable
# coverage while rewriting the baseline. A floating gate changes what CI means
# with no repo change to review. Bump the pin and regenerate the labs/ ledger
# IN THE SAME COMMIT (`npx --yes crashtest@<version> run`, then commit labs/),
# and only when the new rows actually apply to this target.

name: crashtest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  proxy-pair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      # packstruct is the shared /packs spec linter (crashtest#16 class): a
      # manifest declaring an entry that does not ship dies HERE, at lint
      # time, before the harness ever loads the pack.
      - name: Lint the pack manifests (packstruct)
        run: npm run lint:packs

      # crashtest is a pinned devDependency (exact 1.0.0), so the gate runs
      # against the tree the ledger was cut with -- no npx fetch, no float.
      # Run WITHOUT --yes/--no-install: the devDep is the pin.
      - name: Run the proxy pack
        run: npx crashtest run

      - name: Upload the hardening artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hardening
          path: |
            labs/hardening.md
            labs/crashledger.json
            labs/run-meta.json
