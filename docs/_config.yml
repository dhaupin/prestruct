# prestruct docs configuration
# Frame ported from dhaupin/vant docs (single nav source; layout reads site.data.nav):
#   - presentation lives in _layouts/default.html (no theme gem)
#   - nav lives in _data/nav.yml (single source; the layout reads site.data.nav)
# - every page carries the 5 frontmatter fields (see scripts/check-docs-frontmatter.cjs)
#     and links by its permalink (see scripts/check-docs-links.cjs)
title: prestruct
description: Build-time SEO prerender for Vite + React - Documentation
baseurl: "/prestruct"
url: "https://docs.creadev.org"
show_downloads: false

markdown: kramdown
highlighter: rouge

# Pretty URLs (/page/ with trailing slash); page frontmatter permalinks override
permalink: pretty

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - pagefind
  - pagefind-*.tar.gz

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
