# prestruct docs nav (single nav source; layout reads site.data.nav)
# URLs are deployment paths (baseurl-prefixed). Order roughly follows
# a new user's arc: start -> core theory -> deployment -> reference -> meta.
#
# The linters hold this file honest (scripts/run-docs-audit.cjs):
#   - the `links` gate    : every /prestruct/... URL must match a page permalink
#   - the `nav` gate      : every URL here resolves to a real page, no dupes
#   - the `frontmatter` gate : every page it lists must carry all 5 fields

