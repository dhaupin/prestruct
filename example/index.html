<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- No-flash theme bootstrap: the token sheet defaults to dark (the family
       convention, dhaupin/flowforge web styles); only a persisted light theme
       flips html[data-theme]. Runs before first paint, before the bundle. -->
  <script>
    try {
      if (localStorage.getItem('prestruct-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (e) {}
  </script>
  <meta name="theme-color" content="#10131a" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />

  <!-- Primary SEO (populated by inject-brand.js) -->
  <title>prestruct | SEO prerendering for Vite + React</title>
  <meta name="description" content="" />
  <meta name="keywords"    content="" />
  <meta name="author"      content="" />
  <meta name="robots"      content="index, follow" />
  <link rel="canonical"    href="https://prestruct.creadev.org/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
